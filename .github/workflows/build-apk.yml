name: Build m54me APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ls -lh gradle/wrapper/
          ./gradlew assembleDebug --stacktrace
      - name: FIND APK
        run: |
          echo "=== LIST ALL FILES ==="
          find . -name "*.apk" -type f -exec ls -lh {} \;
          echo "=== DEBUG FOLDER ==="
          ls -lh app/build/outputs/apk/ || true
          ls -lh app/build/outputs/apk/debug/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: m54me-apk
          path: "**/*.apk"
